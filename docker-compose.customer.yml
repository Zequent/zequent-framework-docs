x-zequent-env: &zequent-env
  env_file:
    - .env

services:
  # --- Infrastructure --------------------------------------------------
  # Postgres/TimescaleDB and Redis are required by every platform service.
  # Point services at your own managed Postgres/Redis instead for production.

  postgres:
    image: docker.io/timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: zequent_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - zequent_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  redis:
    image: docker.io/library/redis:latest
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped

  # --- Platform services -------------------------------------------------

  connector-service:
    <<: *zequent-env
    image: ghcr.io/zequent/connector-service:latest
    pull_policy: always
    depends_on:
      - postgres
      - redis
    ports:
      - "8010:8010"
    restart: unless-stopped

  live-data-service:
    <<: *zequent-env
    image: ghcr.io/zequent/live-data-service:latest
    pull_policy: always
    depends_on:
      - connector-service
    ports:
      - "8003:8003"
    restart: unless-stopped

  remote-control-service:
    <<: *zequent-env
    image: ghcr.io/zequent/remote-control-service:latest
    pull_policy: always
    depends_on:
      - connector-service
      - live-data-service
    ports:
      - "8002:8002"
    restart: unless-stopped

  mission-autonomy-service:
    <<: *zequent-env
    image: ghcr.io/zequent/mission-autonomy-service:latest
    pull_policy: always
    depends_on:
      - connector-service
      - remote-control-service
    ports:
      - "8004:8004"
    restart: unless-stopped

  admin-console-service:
    <<: *zequent-env
    image: ghcr.io/zequent/admin-console-service:latest
    pull_policy: always
    depends_on:
      - connector-service
      - live-data-service
      - remote-control-service
      - mission-autonomy-service
    ports:
      - "8005:8005"
    restart: unless-stopped

  admin-console-ui:
    <<: *zequent-env
    image: ghcr.io/zequent/zqnt-admin-console-dashboard:latest
    pull_policy: always
    depends_on:
      - admin-console-service
    ports:
      - "3001:3000"
    restart: unless-stopped

  # --- Optional edge adapters (enable with --profile) --------------------
  # Only DJI and MAVLink have a published container image today — see
  # README.md's adapter table. Sapient, RNS, Betaflight, and the AI adapter
  # are real, working code but currently source-only (`uv run`); build your
  # own image from the adapter's own Dockerfile where one exists, or see
  # each adapter's deployment guide under edge-sdk/.

  edge-dji:
    <<: *zequent-env
    image: ghcr.io/zequent/dji-adapter:latest
    pull_policy: always
    profiles: ["edge-dji"]
    ports:
      - "9001:9001"
    restart: unless-stopped

  edge-mavlink:
    <<: *zequent-env
    image: ghcr.io/zequent/zqnt-adapter-mavlink:latest
    pull_policy: always
    profiles: ["edge-mavlink"]
    ports:
      - "9003:50051"
    restart: unless-stopped

volumes:
  zequent_data:
  redis_data:
